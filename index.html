<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZTDS test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    #cta { display: inline-block; padding: .7rem 1.2rem; background: #1a73e8; color: #fff; border-radius: 6px; text-decoration: none; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>ZTDS test</h1>

  <p><a id="cta" href="#" hidden>Перейти</a></p>

  <!-- блок отладки: в рабочей версии удалить -->
  <pre id="log"></pre>

  <script>
    const BASE = 'https://demo.ztds.info/www/';
    const DEFAULT_KEYWORD = 'keyword';
    const AUTO_REDIRECT = false;   // true: сразу переходить без клика
    const FALLBACK_URL = '';       // куда вести, если ZTDS не ответил (пусто = никуда)

    const params = new URLSearchParams(location.search);
    const keyword = params.get('k') || DEFAULT_KEYWORD;
    const autoRedirect = params.has('go') ? params.get('go') === '1' : AUTO_REDIRECT;

    const cta = document.getElementById('cta');
    const logEl = document.getElementById('log');
    const log = s => { logEl.textContent += s + '\n'; };

    // пропускаем только http(s), чтобы в href не попало javascript: и т.п.
    function safeUrl(text) {
      try {
        const u = new URL(text.trim());
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
      } catch (e) {
        return null;
      }
    }

    async function main() {
      const url = BASE + encodeURIComponent(keyword);
      log('Запрос: ' + url);

      let target = null;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        const text = await res.text();
        log('HTTP ' + res.status);
        log('Ответ: ' + text.trim());
        target = safeUrl(text);
        if (!target) log('Ответ не похож на http(s)-ссылку');
      } catch (e) {
        log('Ошибка fetch (CORS или сеть): ' + e.message);
      }

      if (!target && FALLBACK_URL) target = FALLBACK_URL;
      if (!target) return;

      cta.href = target;
      cta.textContent = 'Перейти: ' + target;
      cta.hidden = false;

      if (autoRedirect) location.replace(target);
    }

    main();
  </script>
</body>
</html>
