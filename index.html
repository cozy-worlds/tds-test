<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Перейти</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    #cta { display: inline-block; padding: .7rem 1.2rem; background: #1a73e8; color: #fff; border-radius: 6px; text-decoration: none; }
    #debug { display: none; }
    #debug.on { display: block; }
    pre { background: rgba(128,128,128,.15); padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div id="box"></div>

  <div id="debug">
    <h2>Отладка</h2>
    <pre id="log"></pre>
  </div>

  <script>
    const ENDPOINT = 'https://demo.ztds.info/ttts/';  // адрес ZTDS; ключ ?k=... добавляется после него
    const AUTO_REDIRECT = false;                      // true: сразу переходить без клика
    const FALLBACK_URL = '';                          // куда вести, если ZTDS не ответил (пусто = кнопки нет)
    const BUTTON_TEXT = 'Перейти';
    const SERVICE = ['k', 'go', 'debug'];             // служебные параметры, в ZTDS не уходят

    const params = new URLSearchParams(location.search);
    const keyword = params.get('k') || '';
    const debug = params.get('debug') === '1';
    const autoRedirect = params.has('go') ? params.get('go') === '1' : AUTO_REDIRECT;

    // все параметры, кроме служебных, уходят в ZTDS
    const forward = new URLSearchParams();
    for (const [name, value] of params) {
      if (!SERVICE.includes(name)) forward.append(name, value);
    }

    const box = document.getElementById('box');
    const logEl = document.getElementById('log');
    if (debug) document.getElementById('debug').classList.add('on');
    const log = s => { if (debug) logEl.textContent += s + '\n'; };

    // берёт из ответа первую http(s)-ссылку; всё остальное отбрасывает
    function extractUrl(text) {
      const m = text.match(/https?:\/\/[^\s"'<>]+/i);
      if (!m) return null;
      try {
        const u = new URL(m[0]);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
      } catch (e) {
        return null;
      }
    }

    function showButton(href) {
      const a = document.createElement('a');
      a.id = 'cta';
      a.href = href;
      a.rel = 'noopener';
      a.textContent = BUTTON_TEXT;
      box.appendChild(a);
    }

    async function main() {
      const qs = forward.toString();
      const url = ENDPOINT + (keyword ? encodeURIComponent(keyword) : '') + (qs ? '?' + qs : '');
      log('Запрос: ' + url);

      let target = null;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        const text = (await res.text()).trim();
        log('HTTP ' + res.status);
        log('Ответ: ' + text);
        if (res.ok) target = extractUrl(text);
        if (!target) log('Нет подходящей http(s)-ссылки в ответе');
      } catch (e) {
        log('Ошибка fetch (CORS или сеть): ' + e.message);
      }

      if (!target && FALLBACK_URL) {
        log('Используется FALLBACK_URL');
        target = FALLBACK_URL;
      }
      if (!target) return;

      showButton(target);
      log('Кнопка ведёт на: ' + target);

      if (autoRedirect && !debug) location.replace(target);
    }

    main();
  </script>
</body>
</html>
