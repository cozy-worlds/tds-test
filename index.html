<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZTDS test</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-top: 2rem; font-size: 1.1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid rgba(128,128,128,.35); word-break: break-word; }
    th { font-weight: 600; }
    .tag { font-size: .8rem; opacity: .7; }
    #cta { display: inline-block; padding: .7rem 1.2rem; background: #1a73e8; color: #fff; border-radius: 6px; text-decoration: none; }
    pre { background: rgba(128,128,128,.15); padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>ZTDS test</h1>

  <div id="box"></div>

  <div id="blocks">
    <h2>Параметры из ссылки</h2>
    <div id="params"></div>

    <h2>Страница</h2>
    <div id="info"></div>

    <h2>Лог</h2>
    <pre id="log"></pre>
  </div>

  <script>
    const ENDPOINT = 'https://demo.ztds.info/ttts/';  // адрес ZTDS; ключ ?k=... добавляется после него
    const AUTO_REDIRECT = false;                      // true: сразу переходить без клика
    const FALLBACK_URL = '';                          // куда вести, если ZTDS не ответил (пусто = кнопки нет)
    const BUTTON_TEXT = 'Перейти';
    const SHOW_INFO = true;                           // false: убрать со страницы параметры, данные страницы и лог
    const SERVICE = ['k', 'go'];                      // служебные параметры, в ZTDS не уходят

    const params = new URLSearchParams(location.search);
    const keyword = params.get('k') || '';
    const autoRedirect = params.has('go') ? params.get('go') === '1' : AUTO_REDIRECT;

    // все параметры, кроме служебных, уходят в ZTDS
    const forward = new URLSearchParams();
    for (const [name, value] of params) {
      if (!SERVICE.includes(name)) forward.append(name, value);
    }

    const box = document.getElementById('box');
    const logEl = document.getElementById('log');
    const log = s => { logEl.textContent += s + '\n'; };

    function cell(tag, text) {
      const el = document.createElement(tag);
      el.textContent = text;
      return el;
    }

    // таблица: каждая строка = [название, значение, пометка]
    function renderTable(target, headers, rows) {
      const table = document.createElement('table');
      const head = document.createElement('tr');
      headers.forEach(h => head.appendChild(cell('th', h)));
      table.appendChild(head);
      rows.forEach(r => {
        const tr = document.createElement('tr');
        r.forEach((v, i) => {
          const td = cell('td', v);
          if (i === 2) td.className = 'tag';
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      target.appendChild(table);
    }

    function renderParams() {
      const target = document.getElementById('params');
      const rows = [];
      for (const [name, value] of params) {
        rows.push([name, value, SERVICE.includes(name) ? 'служебный' : 'уходит в ZTDS']);
      }
      if (!rows.length) {
        target.textContent = 'Параметров в ссылке нет.';
        return;
      }
      renderTable(target, ['Параметр', 'Значение', ''], rows);
    }

    function renderInfo() {
      renderTable(document.getElementById('info'), ['Что', 'Значение'], [
        ['Адрес страницы', location.href],
        ['Ключ для ZTDS', keyword || '(не задан)'],
        ['Реферер', document.referrer || '(пусто)']
      ]);
    }

    // берёт из ответа первую http(s)-ссылку; всё остальное отбрасывает
    function extractUrl(text) {
      const m = text.match(/https?:\/\/[^\s"'<>]+/i);
      if (!m) return null;
      try {
        const u = new URL(m[0]);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
      } catch (e) {
        return null;
      }
    }

    function showButton(href) {
      const a = document.createElement('a');
      a.id = 'cta';
      a.href = href;
      a.rel = 'noopener';
      a.textContent = BUTTON_TEXT;
      box.appendChild(a);
    }

    async function main() {
      const qs = forward.toString();
      const url = ENDPOINT + (keyword ? encodeURIComponent(keyword) : '') + (qs ? '?' + qs : '');
      log('Запрос: ' + url);

      let target = null;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        const text = (await res.text()).trim();
        log('HTTP ' + res.status);
        log('Ответ: ' + text);
        if (res.ok) target = extractUrl(text);
        if (!target) log('Нет подходящей http(s)-ссылки в ответе');
      } catch (e) {
        log('Ошибка fetch (CORS или сеть): ' + e.message);
      }

      if (!target && FALLBACK_URL) {
        log('Используется FALLBACK_URL');
        target = FALLBACK_URL;
      }
      if (!target) return;

      showButton(target);
      log('Кнопка ведёт на: ' + target);

      if (autoRedirect) location.replace(target);
    }

    if (SHOW_INFO) {
      renderParams();
      renderInfo();
    } else {
      document.getElementById('blocks').remove();
    }
    main();
  </script>
</body>
</html>
