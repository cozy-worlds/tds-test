<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZTDS test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    #cta { display: inline-block; padding: .7rem 1.2rem; background: #1a73e8; color: #fff; border-radius: 6px; text-decoration: none; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>ZTDS test</h1>

  <div id="box"></div>

  <!-- блок отладки: в рабочей версии удалить -->
  <pre id="log"></pre>

  <script>
    const BASE = 'https://demo.ztds.info/www/';
    const DEFAULT_KEYWORD = 'keyword';
    const AUTO_REDIRECT = false;                 // true: сразу переходить без клика
    const DEMO = true;                           // true: если ответ не ссылка, всё равно показать кнопку-заглушку
    const DEMO_URL = 'https://example.com/';     // куда ведёт кнопка в демо-режиме
    const FALLBACK_URL = '';                     // куда вести, если ZTDS не ответил (пусто = кнопки нет)

    const params = new URLSearchParams(location.search);
    const keyword = params.get('k') || DEFAULT_KEYWORD;
    const autoRedirect = params.has('go') ? params.get('go') === '1' : AUTO_REDIRECT;

    const box = document.getElementById('box');
    const logEl = document.getElementById('log');
    const log = s => { logEl.textContent += s + '\n'; };

    // ищет в ответе первую http(s)-ссылку; всё остальное отбрасывает
    function extractUrl(text) {
      const m = text.match(/https?:\/\/[^\s"'<>]+/i);
      if (!m) return null;
      try {
        const u = new URL(m[0]);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
      } catch (e) {
        return null;
      }
    }

    function makeButton(href, label) {
      const a = document.createElement('a');
      a.id = 'cta';
      a.href = href;
      a.textContent = label;
      box.appendChild(a);
    }

    async function main() {
      const url = BASE + encodeURIComponent(keyword);
      log('Запрос: ' + url);

      let answer = '';
      let target = null;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        answer = (await res.text()).trim();
        log('HTTP ' + res.status);
        log('Ответ: ' + answer);
        target = extractUrl(answer);
        if (!target) log('В ответе нет http(s)-ссылки');
      } catch (e) {
        log('Ошибка fetch (CORS или сеть): ' + e.message);
      }

      if (target) {
        makeButton(target, 'Перейти');
      } else if (DEMO && answer) {
        log('ДЕМО: кнопка ведёт на ' + DEMO_URL);
        target = DEMO_URL;
        makeButton(target, 'Перейти (демо, ответ ZTDS: ' + answer + ')');
      } else if (FALLBACK_URL) {
        target = FALLBACK_URL;
        makeButton(target, 'Перейти');
      } else {
        return;
      }

      if (autoRedirect) location.replace(target);
    }

    main();
  </script>
</body>
</html>
